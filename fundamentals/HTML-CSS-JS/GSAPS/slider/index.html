<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyager Slider</title>
    <link rel="stylesheet" href="./styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
</head>
<body>
    <div class="app">
        <div class="app__bg">
            <div class="app__bg__image current--image">
                <img src="https://media.gettyimages.com/id/1308731271/photo/majestic-viewpoint-of-jodhpur-mehrangarh-fort-and-jaswant-thada-rajasthan-india.jpg?s=612x612&w=0&k=20&c=zG7AezWK8A86RO2lxByeysnRveI-6AOubh8W6BWe_8I=" alt="" />
            </div>
            <div class="app__bg__image next--image">
                <img src="https://w0.peakpx.com/wallpaper/307/324/HD-wallpaper-aerial-of-machu-picchu-peru.jpg" alt="" />
            </div>
            <div class="app__bg__image previous--image">
                <img src="https://images.pexels.com/photos/3163943/pexels-photo-3163943.jpeg" alt="" />
            </div>
        </div>
    </div>
    <div class="cardList">
        <button class="cardList__btn btn btn--left">
            <div class="icon">
                <span class="material-symbols-outlined">keyboard_arrow_left</span>
            </div>
        </button>
        <div class="cards__wrapper">
            <div class="card current--card">
                <div class="card__image">
                    <img src="https://media.gettyimages.com/id/1308731271/photo/majestic-viewpoint-of-jodhpur-mehrangarh-fort-and-jaswant-thada-rajasthan-india.jpg?s=612x612&w=0&k=20&c=zG7AezWK8A86RO2lxByeysnRveI-6AOubh8W6BWe_8I=" alt="" />
                </div>
            </div>
            <div class="card next--card">
                <div class="card__image">
                    <img src="https://w0.peakpx.com/wallpaper/307/324/HD-wallpaper-aerial-of-machu-picchu-peru.jpg" alt="" />
                </div>
            </div>
            <div class="card previous--card">
                <div class="card__image">
                    <img src="https://images.pexels.com/photos/3163943/pexels-photo-3163943.jpeg" alt="" />
                </div>
            </div>
        </div>
        <button class="cardList__btn btn btn--right">
            <div class="icon">
                <span class="material-symbols-outlined">keyboard_arrow_right</span>
            </div>
        </button>
    </div>
    <div class="infoList">
        <div class="info__wrapper">
            <div class="info current--info">
                <h1 class="text name">James</h1>
                <h4 class="text location">Kenya</h4>
                <p class="text description">Fort of the Sun</p>
            </div>
            <div class="info next--info">
                <h1 class="text name">Machu Jamez</h1>
                <h4 class="text location">Peru</h4>
                <p class="text description">Adventure is never far away</p>
            </div>
            <div class="info previous--info">
                <h1 class="text name">Chamonix Jamez</h1>
                <h4 class="text location">France</h4>
                <p class="text description">Let your dreams come true</p>
            </div>
        </div>
        <div class="loading__wrapper">
            <div class="loader--text">Please Wait...</div>
            <div class="loader">
                <span></span>
            </div>
        </div>
    </div>
    <script src="https://unpkg.com/imagesloaded@4/imagesloaded.pkgd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.3.3/gsap.min.js"></script>
    <script src="./main.js"></script>
</body>
</html>
