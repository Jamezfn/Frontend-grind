<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card flip Project</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="front-page">
                <div class="card-info">
                    <h2 class="card-title">Natasha Raminof</h2>
                    <p class="card-subtitle">100M followers on Instagram</p>
                </div>
            </div>
            <div class="back-page">
                <div class="card-content">
                    <h3>Natasha Raminof</h3>
                    <p class="card-description">
                        Natasha is a top actor in the marvel universe. Featuring in Avengers sequal.
                        She also her solos, Black widow. She's an award winning for female lead actress. She's from the USA.
                    </p>
                    <button class="card-btn">Explore more</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
