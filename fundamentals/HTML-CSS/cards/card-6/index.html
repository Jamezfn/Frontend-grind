<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Product Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <div class="circle">
            <img src="logo.png" alt="Sprite Logo" class="logo">
        </div>
        <img src="bottle.png" alt="Pepsi can" class="product_img">
        <div class="content">
            <h2>SPRITE</h2>
            <p>Sprite is a cool, refreshing drink that satisfies your thirst and delights your taste buds. Our secret blend of flavors.</p>
            <a href="#">Shop Now</a>
        </div>
    </div>
</body>
</html>
